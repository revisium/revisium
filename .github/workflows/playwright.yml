name: Tests and Build

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
  # Temporarily disabled - uncomment to enable on push/PR
  # push:
  #   branches: [master]
  #   tags:
  #     - 'v*'
  # pull_request:
  #   branches: [master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          cache: 'npm'

      - name: Create test .env
        run: cp .env.e2e-tests .env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.dependencies["@playwright/test"].version' package.json)" >> $GITHUB_OUTPUT

      - name: Cache playwright binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare DB & Admin
        run: npm run prepare:playwright-tests

      - name: Start NestJS in background
        run: npm run start:debug &

      - name: Wait for NestJS to be ready
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run Playwright tests
        run: ./node_modules/.bin/playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    needs: test
    if: ${{ github.event_name == 'push' && needs.test.result == 'success' }}
    uses: ./.github/workflows/build.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      KUBE_SERVICE_NAME: ${{ secrets.KUBE_SERVICE_NAME }}
      KUBE_APP_URL: ${{ secrets.KUBE_APP_URL }}
