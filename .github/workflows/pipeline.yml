name: Pipeline

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:
    inputs:
      docker:
        description: 'Build and push Docker image'
        type: boolean
        default: false
      deploy:
        description: 'Deploy to Kubernetes'
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: 'npm'
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run tsc

  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: 'npm'
      - run: npm ci
      - run: npm run standalone:build
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-package
          path: standalone/
          retention-days: 1

  smoke-test:
    needs: [ci, build-standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - uses: actions/download-artifact@v4
        with:
          name: standalone-package
          path: standalone/
      - name: Run smoke tests
        run: bash scripts/standalone-smoke-test.sh

  docker:
    needs: smoke-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.docker)
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    needs: docker
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      KUBE_SERVICE_NAME: ${{ secrets.KUBE_SERVICE_NAME }}
      KUBE_APP_URL: ${{ secrets.KUBE_APP_URL }}
